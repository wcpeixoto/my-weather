name: Update weather calendars

on:
  schedule:
    - cron: "23 * * * *" # hourly, at :23 past
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 generate_ics.py
      - name: Commit updated calendars
        run: |
          git config user.name "weather-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendars
          git diff --cached --quiet || git commit -m "Update weather calendars"
          git push
